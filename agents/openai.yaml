interface:
  display_name: "Mermail Research Agent"
  short_description: "Autonomously purchase and synthesize research reports using Mermail email and wallet"
  default_prompt: "Use $mermail-research-agent to find and purchase a research report on the user's topic"

dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace, email, and Agent Wallet MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
